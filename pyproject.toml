[project]
name = "xlsx_compare"
version = "0.2.2"
description = ""
authors = [{ name = "Stanislav Rejthar", email = "rejthar@stanislavrejthar.com" }]
dependencies = ["pandas", "openpyxl", "mininterface[basic]<=1.2.2"]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
xlsx_compare = "xlsx_compare:main"

[dependency-groups]
test = ["pytest>=7,<10"]
lint = ["black", "isort", "pylint", "ruff"]
dev = [{include-group = "test"}, {include-group = "lint"}]

[tool.setuptools]
py-modules = ["xlsx_compare"]
