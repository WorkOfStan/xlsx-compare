---
name: Polish the code

on:
  push:
    branches-ignore:
      # notest branches to ignore testing of partial online commits
      - "notest/**"

  pull_request:
    branches-ignore:
      # notest branches to ignore testing of partial online commits
      - "notest/**"

  schedule:
    # Run the workflow at 6:30 AM UTC on the 18th of every month
    - cron: "30 6 18 * *"
    # Scheduled runs do not commit-changes automatically to the same branch

permissions:
  # only prettier-fix and phpcs-phpcbf need write permission, for others read is enough
  contents: read

jobs:
  prettier-fix:
    # Note: runs-on doesn't accept all expressions, so a string is used
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    # Limit the running time
    timeout-minutes: 10
    steps:
      - name: Invoke the Prettier fix
        uses: WorkOfStan/prettier-fix@v1
        with:
          commit-changes: ${{ github.event_name != 'schedule' }}

  pytest:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install . pytest

      - name: Run regression tests
        run: |
          # Pytest creates its base temp directory, but requires the parent to exist.
          mkdir -p .tmp
          python -m pytest -q -p no:cacheprovider --basetemp=.tmp/pytest test_xlsx_compare.py

  super-linter:
    needs: [prettier-fix, pytest]
    uses: WorkOfStan/seablast-actions/.github/workflows/linter.yml@v0.2.11
    with:
      runs-on: "ubuntu-latest"
